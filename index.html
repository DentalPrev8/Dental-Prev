 <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>/title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #183b56;
            background: #ffffff;
            line-height: 1.6;
        }

        /* MENU */
        header {
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            z-index: 1000;
        }

        nav {
            max-width: 1150px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 25px;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
            color: #087f8c;
        }

        .logo span {
            color: #183b56;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 28px;
        }

        nav a {
            text-decoration: none;
            color: #183b56;
            font-weight: 600;
        }

        nav a:hover {
            color: #087f8c;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background:
                linear-gradient(rgba(5, 73, 88, 0.72), rgba(5, 73, 88, 0.72)),
                url("https://images.unsplash.com/photo-1606811971618-4486d14f3f99?auto=format&fit=crop&w=1600&q=80")
                center/cover;
            color: white;
            padding: 120px 25px 70px;
        }

        .hero-content {
            max-width: 1150px;
            width: 100%;
            margin: auto;
        }

        .hero h1 {
            font-size: 55px;
            max-width: 700px;
            line-height: 1.15;
            margin-bottom: 22px;
        }

        .hero p {
            font-size: 20px;
            max-width: 650px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 27px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .button-primary {
            background: #16b5a4;
            color: white;
        }

        .button-primary:hover {
            background: #0e9285;
            transform: translateY(-2px);
        }

        .button-light {
            background: white;
            color: #087f8c;
            margin-left: 10px;
        }

        /* SEÇÕES */
        section {
            padding: 90px 25px;
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 38px;
            color: #183b56;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #687b88;
        }

        /* SOBRE */
        .about {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .about img {
            width: 100%;
            border-radius: 20px;
        }

        .about h2 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        .about p {
            color: #5e707d;
            margin-bottom: 15px;
        }

        /* SERVIÇOS */
        .services {
            background: #f4fbfa;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .card {
            background: white;
            padding: 30px 22px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-7px);
        }

        .card .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #71808a;
            font-size: 14px;
        }

        /* CONSULTA GRÁTIS */
        .free-consultation {
            background: linear-gradient(135deg, #087f8c, #16b5a4);
            color: white;
            text-align: center;
        }

        .free-consultation h2 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .free-consultation p {
            max-width: 700px;
            margin: 0 auto 30px;
            font-size: 18px;
        }

        /* BENEFÍCIOS */
        .benefits {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .benefit {
            padding: 30px;
            border: 1px solid #e5eeee;
            border-radius: 15px;
        }

        .benefit h3 {
            margin-bottom: 10px;
        }

        /* CONTACTOS */
        .contact {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .contact-box {
            background: #f4fbfa;
            padding: 35px;
            border-radius: 18px;
        }

        .contact-box h3 {
            margin-bottom: 20px;
            font-size: 25px;
        }

        .contact-item {
            margin: 15px 0;
        }

        .contact-item strong {
            display: block;
            color: #087f8c;
        }

        /* FOOTER */
        footer {
            background: #123448;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        footer p {
            margin: 5px;
        }

        /* WHATSAPP */
        .whatsapp {
            position: fixed;
            right: 22px;
            bottom: 22px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #25D366;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-size: 29px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.25);
            z-index: 999;
        }

        /* MOBILE */
        @media (max-width: 850px) {

            nav ul {
                gap: 12px;
                font-size: 13px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .about,
            .contact {
                grid-template-columns: 1fr;
            }

            .benefits {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 550px) {

            nav {
                padding: 14px 15px;
            }

            .logo {
                font-size: 21px;
            }

            nav ul {
                display: none;
            }

            .hero {
                min-height: 90vh;
            }

            .hero h1 {
                font-size: 34px;
            }

            .hero p {
                font-size: 17px;
            }

            .button {
                display: block;
                text-align: center;
                margin: 10px 0;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            section {
                padding: 65px 18px;
            }

            .section-title h2 {
                font-size: 30px;
            }
        }
    </style>
</head>
